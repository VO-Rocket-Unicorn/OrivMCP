[project]
name = "oriv_mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "mcp>=1.9.0",
    "numpy>=2.4.6",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "scipy>=1.17.1",
    "uvicorn>=0.46.0",
]

[project.scripts]
app = "bin.runner:run"

[dependency-groups]
dev = ["ruff>=0.15.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
line-length = 500
exclude = [".git", "__pycache__", ".venv", "build", "dist"]
ignore = ["W291", "W293", "E303", "E225", "F403"]
