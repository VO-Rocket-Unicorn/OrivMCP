[project]
name = "lib-oriv-telemetry"
version = "0.1.0"
description = "Logging and OpenTelemetry tracing/metrics utilities for Oriv services."
readme = "README.md"
requires-python = ">=3.14,<4.0"

dependencies = [
    "pydantic>=2.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42.1",
    "opentelemetry-exporter-prometheus>=0.63b1",
    "opentelemetry-instrumentation>=0.63b1",
    "opentelemetry-instrumentation-logging>=0.63b1",
    "rich>=15.0.0",
    "toml>=0.10.2",
]

[project.optional-dependencies]
dspy = ["dspy>=2.5", "openinference-instrumentation-dspy>=0.1.37"]
mistral = ["mistralai>=1.0"]
litellm = ["openinference-instrumentation-litellm>=0.1.34"]
all = [
    "dspy>=2.5",
    "openinference-instrumentation-dspy>=0.1.37",
    "mistralai>=1.0",
    "openinference-instrumentation-litellm>=0.1.34",
]

[dependency-groups]
dev = ["ruff>=0.15.14", "pytest>=8.0", "pytest-asyncio>=0.24"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
lint = "scripts.code_quality:lint"
format = "scripts.code_quality:format"
